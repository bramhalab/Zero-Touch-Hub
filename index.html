<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Hub - Fruit Cutter</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="ambient-glow"></div>

    <nav>
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 22h20L12 2z" />
            </svg>
            <span>Zero Touch Hub</span>
        </div>
        <div class="nav-actions">
            <button id="auth-btn" class="login-btn">
                <span>Login</span>
            </button>
            <div id="user-profile" class="user-profile" style="display: none;">
                <div class="profile-info">
                    <span id="nav-username" class="nav-username">Player</span>
                    <span class="nav-score">🏆 <span id="nav-userscore">0</span></span>
                </div>
                <button id="logout-btn" class="logout-btn" title="Logout">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-color)"
                        stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <main>
        <div class="hero" id="hero-section">
            <button id="hero-prev" class="hero-nav-btn prev">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 18l-6-6 6-6" />
                </svg>
            </button>
            <button id="hero-next" class="hero-nav-btn next">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18l6-6-6-6" />
                </svg>
            </button>

            <div class="hero-content">
                <span class="badge">Featured Release</span>
                <h1 class="title" id="featured-title">Loading<br>Game<span class="dot">.</span></h1>
                <p class="description" id="featured-desc">Please wait while the games are being loaded...</p>
                <div class="actions">
                    <a href="#" class="play-button" id="featured-link">
                        <span class="btn-text">Play Game</span>
                        <div class="btn-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M5 12h14"></path>
                                <path d="m12 5 7 7-7 7"></path>
                            </svg>
                        </div>
                    </a>
                </div>
            </div>

            <div class="hero-visual">
                <div class="glass-platform"></div>
                <div class="game-cover">
                    <!-- Icon loaded via inline style or CSS class -->
                    <div class="cover-image" id="featured-icon"></div>
                    <div class="cover-glow" id="featured-glow"></div>
                </div>
                <div class="floating-elements">
                    <div class="particle p1"></div>
                    <div class="particle p2"></div>
                    <div class="particle p3"></div>
                </div>
            </div>
        </div>

        <!-- All Games Section -->
        <section class="more-games" id="categories-container">
            <!-- Javascript will inject grouped games here -->
        </section>
        <!-- Auth Modal -->
        <div id="auth-modal" class="modal-overlay" style="display: none;">
            <div class="modal-box">
                <button id="close-modal" class="close-btn">&times;</button>
                <div class="modal-header">
                    <h2 id="modal-title">Access Hub</h2>
                    <p id="modal-subtitle">Login to sync your high scores</p>
                </div>

                <div class="modal-tabs">
                    <button class="tab-btn active" data-tab="login">Login</button>
                    <button class="tab-btn" data-tab="register">Register</button>
                </div>

                <form id="auth-form" class="auth-form">
                    <div class="input-group">
                        <label for="username">Player Name</label>
                        <input type="text" id="username" placeholder="Choose a legendary name" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Secret Key</label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>

                    <div id="auth-error" class="auth-msg error" style="display: none;"></div>
                    <div id="auth-success" class="auth-msg success" style="display: none;"></div>

                    <button type="submit" id="submit-auth-btn" class="submit-btn auth-submit">
                        <span id="submit-btn-text">Start Playing</span>
                        <div id="submit-spinner" class="spinner" style="display: none;"></div>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
